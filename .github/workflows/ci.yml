name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff flake8

      - name: Ruff (syntax + runtime correctness)
        run: ruff check --select E9,F desktop_ui_utils.py external_ocr_bridge.py tests

      - name: Flake8 (syntax + runtime correctness)
        run: flake8 --select=E9,F63,F7,F82 desktop_ui_utils.py external_ocr_bridge.py tests

      - name: Unit tests with coverage
        run: |
          pytest tests -m "not integration" \
            --cov=desktop_ui_utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
